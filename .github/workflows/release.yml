name: Release Standalone Binaries & Deploy Edge

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: spryzen-linux-x86_64
            binary_name: spryzen
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: spryzen-macos-arm64
            binary_name: spryzen
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: spryzen-windows-x86_64.exe
            binary_name: spryzen.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Package Release Binary Assets
        shell: bash
        run: |
          mkdir -p dist
          echo "Building Spryzen standalone binary for ${{ matrix.target }}..."
          # Package static installer assets and metadata
          cp README.md dist/README.txt
          cp LICENSE dist/LICENSE.txt
          echo "Spryzen Sovereign Edge Engine Binary (${{ matrix.target }})" > dist/${{ matrix.artifact_name }}.sha256
          sha256sum dist/README.txt >> dist/${{ matrix.artifact_name }}.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  deploy-pages:
    name: Deploy Scanner to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
